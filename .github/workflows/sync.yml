name: sync-data

# 매일 2회(09:00·15:00 KST) gitlab.aigov.go.kr에서 data.json을 수집해 main에 커밋한다.
# 커밋되면 GitHub Pages와 Vercel(Git 연동)이 main을 자동 재배포해 라이브에 반영된다.
on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 09:00 KST
    - cron: "0 6 * * *"   # 06:00 UTC = 15:00 KST
  workflow_dispatch: {}    # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Collect data.json
        env:
          # 공개 저장소면 불필요. 비공개 저장소 집계 시 리포 Secret에 등록.
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: node collect.mjs

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json 변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "sync"
          # 수집 중 main에 다른 커밋이 올라왔을 수 있으므로 rebase 후 push
          git pull --rebase origin main
          git push origin HEAD:main
