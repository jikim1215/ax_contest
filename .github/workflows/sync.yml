name: sync-data

# gitlab.aigov.go.kr에서 data.json을 수집해 main에 커밋한다.
# 커밋되면 GitHub Pages와 Vercel(Git 연동)이 main을 자동 재배포해 라이브에 반영된다.
#
# 라이브 화면의 내용은 오직 data.json에서 온다. collect.mjs만 고쳐 push하면
# 재배포는 되지만 화면은 그대로다(수집이 다시 돌아야 data.json이 바뀐다).
# 그래서 collect.mjs 변경 push를 수집 트리거로 잡는다 — 저장소 목록을
# 고치면 몇 분 안에 화면에 반영된다.
on:
  push:
    branches: [main]
    paths:
      - collect.mjs
      - .github/workflows/sync.yml
  schedule:
    # 정시(분 00)는 GitHub 스케줄러 혼잡 구간이라 수 시간씩 밀린다. 분을 흩어 잡는다.
    - cron: "37 23 * * *"   # 23:37 UTC = 08:37 KST
    - cron: "37 5 * * *"    # 05:37 UTC = 14:37 KST
  workflow_dispatch: {}    # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Collect data.json
        env:
          # 공개 저장소면 불필요. 비공개 저장소 집계 시 리포 Secret에 등록.
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: node collect.mjs

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json 변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "sync"
          # 수집 중 main에 다른 커밋이 올라왔을 수 있으므로 rebase 후 push
          git pull --rebase origin main
          git push origin HEAD:main
