<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KISA AX 공모전 진행 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* Hallmark · studied-DNA build · source: usehallmark.com/examples/hum-07/ (Hum theme)
   * theme: Hum · paper oklch(97% 0.012 95) cream · multi-accent (pear 95 / cyan 235 / coral 18 / mint 150 / lavender 305)
   * display+body: Plus Jakarta Sans · labels: JetBrains Mono · Korean fallback: Pretendard
   * macrostructure: Workbench + full-page scroll-snap · nav: grouped (parent > child hierarchy)
   * pre-emit critique: P5 H4 E4 S5 R4 V5 */
  :root{
    --color-paper:      oklch(97% 0.012 95);
    --color-paper-2:    oklch(94% 0.016 95);
    --color-paper-3:    oklch(91% 0.020 95);
    --color-rule:       oklch(86% 0.014 90);
    --color-rule-2:     oklch(70% 0.018 85);
    --color-muted:      oklch(50% 0.014 90);
    --color-neutral:    oklch(38% 0.014 100);
    --color-ink-2:      oklch(28% 0.014 250);
    --color-ink:        oklch(20% 0.012 250);
    --color-accent:      oklch(86% 0.18 95);
    --color-accent-deep: oklch(76% 0.20 95);
    --color-accent-2:      oklch(66% 0.18 235);
    --color-accent-2-deep: oklch(50% 0.19 235);
    --color-accent-3:      oklch(68% 0.24 18);
    --color-accent-3-deep: oklch(48% 0.24 18);
    --color-mint:        oklch(80% 0.16 150);
    --color-mint-deep:   oklch(48% 0.15 150);
    --color-lavender:      oklch(74% 0.16 305);
    --color-lavender-deep: oklch(48% 0.16 305);
    --color-accent-ink: oklch(20% 0.012 250);
    --color-focus:      oklch(48% 0.20 235);
    --tint-pear:     oklch(86% 0.18 95 / 0.18);
    --tint-cyan:     oklch(66% 0.18 235 / 0.14);
    --tint-coral:    oklch(68% 0.24 18 / 0.12);
    --tint-mint:     oklch(80% 0.16 150 / 0.18);
    --tint-lavender: oklch(74% 0.16 305 / 0.14);
    --accent: var(--color-accent-2); --accent-soft: var(--tint-cyan);

    --font-display:"Pretendard","Plus Jakarta Sans","Malgun Gothic","맑은 고딕",ui-sans-serif,system-ui,sans-serif;
    --font-body:"Pretendard","Plus Jakarta Sans","Malgun Gothic","맑은 고딕",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-label:"JetBrains Mono","Pretendard","Malgun Gothic",ui-monospace,"SFMono-Regular",Menlo,monospace;

    --radius-card:20px; --radius-input:12px; --radius-pill:999px;
    --nav-h:64px;
    --shadow-card:0 12px 32px -16px oklch(20% 0.012 250 / 0.14), 0 1px 2px oklch(20% 0.012 250 / 0.06);
    --shadow-card-hover:0 24px 56px -20px oklch(20% 0.012 250 / 0.18), 0 2px 6px oklch(20% 0.012 250 / 0.08);
    --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
    --ease-push:cubic-bezier(0.2,0.7,0.3,1);
    --dur-micro:120ms; --dur-short:220ms;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;}
  html,body{overflow-x:clip;}
  body{
    margin:0; background:var(--color-paper); color:var(--color-ink-2);
    font-family:var(--font-body); font-weight:400; font-size:16.5px; line-height:1.65;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    font-feature-settings:"ss01" on, "cv11" on; font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:1200px; margin:0 auto; padding:28px 24px 96px;}
  a{color:var(--color-accent-2-deep); font-weight:600; text-decoration:none;}
  a:hover{text-decoration:underline; text-underline-offset:3px;}
  .muted{color:var(--color-muted); font-family:var(--font-label); font-size:13px; letter-spacing:.02em;}

  /* ===== Masthead ===== */
  header{position:relative; background:var(--color-paper-2); border-bottom:1px solid var(--color-rule);}
  header .inner{max-width:1200px; margin:0 auto; padding:30px 24px 28px;
    display:flex; gap:22px; flex-wrap:wrap; align-items:center; justify-content:space-between;}
  .brand{display:flex; gap:16px; align-items:center; min-width:0;}
  .mark{flex:none; width:54px; height:54px; border-radius:16px; display:grid; place-items:center;
    background:var(--color-accent); color:var(--color-ink); font-family:var(--font-display); font-weight:700; font-size:20px;
    box-shadow:0 4px 0 0 var(--color-accent-deep), 0 6px 14px -4px oklch(76% 0.20 95 / 0.5);}
  .eyebrow{margin:0 0 7px; font-family:var(--font-label); font-size:12px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; color:var(--color-accent-2-deep);}
  header h1{margin:0; font-family:var(--font-display); font-size:27px; font-weight:700; letter-spacing:-.02em; color:var(--color-ink);}
  header .sub{margin:8px 0 0; font-size:14.5px; color:var(--color-muted);}
  .dday-wrap{display:flex; gap:12px;}
  .dday{background:var(--color-paper); border:1px solid var(--color-rule); border-radius:16px; box-shadow:var(--shadow-card);
    padding:12px 20px; min-width:108px; text-align:center;}
  .dday b{display:block; font-family:var(--font-display); font-size:27px; font-weight:700; letter-spacing:-.02em; color:var(--color-ink);}
  .dday:last-child b{color:var(--color-accent-3-deep);}
  .dday span{display:block; margin-top:4px; font-family:var(--font-label); font-size:10.5px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--color-muted);}

  /* ===== Nav — grouped; PARENT label larger than child buttons ===== */
  .mainnav{position:sticky; top:0; z-index:40; background:oklch(97% 0.012 95 / .9);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--color-rule); margin-bottom:0;}
  .nav-inner{max-width:1200px; margin:0 auto; padding:11px 24px; display:flex; gap:14px; align-items:center; overflow-x:auto; min-height:var(--nav-h);}
  .nav-inner::-webkit-scrollbar{height:6px;} .nav-inner::-webkit-scrollbar-thumb{background:var(--color-rule-2); border-radius:3px;}
  .nav-group{display:flex; align-items:center; gap:6px;}
  .nav-group + .nav-group{border-left:1.5px solid var(--color-rule); margin-left:6px; padding-left:16px;}
  .nav-group-label{flex:none; display:flex; align-items:center; gap:8px; font-family:var(--font-display);
    font-size:17px; font-weight:700; letter-spacing:-.01em; color:var(--color-ink); padding-right:4px; white-space:nowrap;}
  .nav-group-label::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--color-accent);}
  .nav-group:nth-of-type(2) .nav-group-label::before{background:var(--color-accent-2);}
  .nav-btn{flex:none; border:0; background:transparent; border-radius:var(--radius-pill); padding:9px 16px;
    font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--color-ink-2); cursor:pointer; white-space:nowrap;
    transition:background var(--dur-micro) var(--ease-push), color var(--dur-micro) var(--ease-push);}
  .nav-btn:hover{background:var(--color-paper-3); color:var(--color-ink);}
  .nav-btn.active{background:var(--tint-pear); color:var(--color-ink); box-shadow:inset 0 0 0 1.5px var(--color-accent-deep);}
  .nav-btn:focus-visible{outline:3px solid var(--color-focus); outline-offset:2px;}

  /* ===== Views + full-page scroll sections ===== */
  .tabview[hidden]{display:none;}
  .tabview{animation:fade .26s var(--ease-spring);}
  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  /* full-page scroll-snap 제거 — 탭 전환 시 화면이 아래로 밀리는 현상 방지 */
  .page{min-height:calc(100vh - var(--nav-h)); display:flex; flex-direction:column; justify-content:center; gap:22px; padding:56px 0;}
  .page--start{justify-content:flex-start; padding-top:40px;}
  .page-kicker{margin:0 0 4px; font-family:var(--font-label); font-size:14px; font-weight:600; letter-spacing:.02em; color:var(--color-accent-2-deep);}
  .scroll-hint{margin:12px 0 0; text-align:center; font-family:var(--font-label); font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--color-muted); animation:bob 1.7s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0); opacity:.55;} 50%{transform:translateY(6px); opacity:1;}}

  /* ===== 대시보드 — 다른 페이지와 동일한 전체 폭 단일 컬럼 ===== */
  .dash{display:flex; flex-direction:column; gap:20px;}
  .dash > .page-kicker, .dash > .notice, .dash > .metrics, .dash > .panel, .dash > .grid2{margin:0;}

  /* ===== Panels ===== */
  .panel{background:var(--color-paper); border:1px solid var(--color-rule); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:24px; margin-bottom:20px;}
  .panel:last-child{margin-bottom:0;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .panel-head h2{margin:0;}
  .panel h2{margin:0 0 18px; font-family:var(--font-display); font-size:21px; font-weight:700; color:var(--color-ink);
    letter-spacing:-.015em; display:flex; align-items:center; gap:11px;}
  .panel h2::before{content:""; flex:none; width:12px; height:12px; border-radius:50%; background:var(--color-accent);}

  /* ===== Notice / status ===== */
  .status-msg{background:var(--color-paper-2); border:1px solid var(--color-rule); color:var(--color-neutral);
    border-radius:var(--radius-card); padding:18px 20px; margin-bottom:20px; font-size:15px;}
  .notice{background:var(--tint-pear); border:1px solid var(--color-rule); border-radius:var(--radius-card);
    padding:18px 20px; display:flex; gap:13px; align-items:center; flex-wrap:wrap; font-size:15.5px;}
  .notice .tag{font-family:var(--font-label); font-size:11.5px; font-weight:500; letter-spacing:.05em; text-transform:uppercase;
    background:var(--color-accent); color:var(--color-ink); border-radius:var(--radius-pill); padding:5px 13px; white-space:nowrap;
    box-shadow:0 3px 0 0 var(--color-accent-deep);}
  .notice b{color:var(--color-ink);}

  /* ===== Metrics — big counters ===== */
  .metrics{display:grid; grid-template-columns:repeat(5,1fr); gap:16px;}
  @media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr);}}
  .metric{position:relative; background:var(--color-paper); border:1px solid var(--color-rule); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:18px;
    transition:transform var(--dur-short) var(--ease-spring), box-shadow var(--dur-short);}
  .metric:hover{transform:translateY(-4px); box-shadow:var(--shadow-card-hover);}
  .metric::before{content:""; position:absolute; top:12px; right:12px; width:9px; height:9px; border-radius:50%; background:var(--color-accent);}
  .metric:nth-child(2)::before{background:var(--color-mint);}
  .metric:nth-child(3)::before{background:var(--color-accent-3);}
  .metric:nth-child(4)::before{background:var(--color-accent-2);}
  .metric:nth-child(5)::before{background:var(--color-lavender);}
  .metric .label{font-family:var(--font-label); font-size:11px; font-weight:500; letter-spacing:.05em; text-transform:uppercase; color:var(--color-muted);}
  .metric .value{font-family:var(--font-display); font-size:29px; font-weight:700; letter-spacing:-.02em; color:var(--color-ink); margin:5px 0 2px; font-variant-numeric:tabular-nums; line-height:1;}
  .metric .hint{font-size:11.5px; color:var(--color-muted);}
  .metric.green .value,.metric.blue .value,.metric.purple .value,.metric.orange .value{color:var(--color-ink);}

  /* ===== Timeline (가로형) ===== */
  .timeline{position:relative; margin:22px 8px 40px;}
  .timeline .track{height:10px; border-radius:var(--radius-pill); background:var(--color-paper-3); position:relative; overflow:hidden;}
  .timeline .fill{position:absolute; inset:0 auto 0 0; background:var(--color-mint); border-radius:var(--radius-pill);}
  .timeline .today{position:absolute; top:-22px; transform:translateX(-50%);
    font-family:var(--font-label); font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--color-accent-3-deep); text-align:center; white-space:nowrap;}
  .timeline .today::after{content:""; display:block; width:2px; height:22px; background:var(--color-accent-3); margin:2px auto 0; border-radius:2px;}
  .ms{position:absolute; top:-3px; transform:translateX(-50%);}
  .ms .dot{width:14px; height:14px; border-radius:50%; background:var(--color-paper); border:3px solid var(--color-rule-2); margin:0 auto;}
  .ms.done .dot{border-color:var(--color-mint-deep); background:var(--color-mint);}
  .ms .lbl,.ms-range .lbl{position:relative; font-size:12px; line-height:1.2; color:var(--color-ink-2); font-weight:600; margin-top:8px; text-align:center; white-space:nowrap;}
  .ms.ms--far .lbl{margin-top:30px;}
  .ms.ms--far .lbl::before{content:""; position:absolute; left:50%; top:-28px; transform:translateX(-50%); width:2px; height:26px; background:var(--color-rule-2); border-radius:1px;}
  .ms .date,.ms-range .date{font-family:var(--font-label); font-size:10.5px; line-height:1.2; color:var(--color-muted); text-align:center; white-space:nowrap;}
  .ms-range{position:absolute; top:0;}
  .ms-range .rbar{height:10px; border-radius:var(--radius-pill); background:var(--color-accent-2); box-shadow:inset 0 0 0 1px var(--color-accent-2-deep);}
  .ms-range.done .rbar{background:var(--color-mint); box-shadow:inset 0 0 0 1px var(--color-mint-deep);}
  .ms-range .dot{position:absolute; top:-2px; left:-1px; width:14px; height:14px; border-radius:50%; background:var(--color-paper); border:3px solid var(--color-accent-2-deep); box-sizing:border-box; margin:0;}
  .ms-range.done .dot{border-color:var(--color-mint-deep); background:var(--color-mint);}
  .ms-range .lbl{margin-top:10px;}
  /* 전체 일정 패널 컴팩트 (과제별 추진현황을 더 부각) */
  .sched{padding:22px 24px;}
  .sched .panel-head{margin-bottom:4px;}
  /* 전체 일정 가로 스크롤 안내 — JS가 실제 스크롤 가능할 때만 is-scrollable 부여 */
  .timeline-wrap{position:relative;}
  .timeline-cue{display:none;}
  .timeline-wrap.is-scrollable .timeline-cue{
    display:flex; align-items:center; justify-content:flex-end; gap:6px;
    margin:0 2px 4px 0; font-family:var(--font-label); font-size:11.5px; font-weight:600;
    letter-spacing:.02em; color:var(--color-accent-2-deep); transition:opacity var(--dur-short);}
  .timeline-wrap.is-scrollable.at-end .timeline-cue{opacity:.35;}
  .timeline-cue .tc-arrow{font-size:14px; line-height:1; animation:tcbob 1.5s ease-in-out infinite;}
  @keyframes tcbob{0%,100%{transform:translateX(-3px);} 50%{transform:translateX(3px);}}
  .timeline-wrap::after{content:""; position:absolute; top:26px; right:0; bottom:8px; width:44px;
    background:linear-gradient(to right, transparent, var(--color-paper)); pointer-events:none;
    opacity:0; transition:opacity var(--dur-short) var(--ease-push);}
  .timeline-wrap.is-scrollable:not(.at-end)::after{opacity:1;}

  /* ===== Filters ===== */
  .filters{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .filters select,.filters input{border:1px solid var(--color-rule-2); border-radius:var(--radius-input); min-height:48px;
    padding:10px 16px; font:inherit; font-size:15px; background:var(--color-paper); color:var(--color-ink); outline:none;}
  .filters input{flex:1 1 240px;}
  .filters select:focus,.filters input:focus{border-color:var(--color-accent-2); box-shadow:0 0 0 3px var(--tint-cyan);}

  /* ===== Project cards ===== */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr)); gap:18px;}
  .card{position:relative; background:var(--color-paper); border:1px solid var(--color-rule); border-radius:var(--radius-card); box-shadow:var(--shadow-card);
    padding:22px; display:flex; flex-direction:column; gap:10px;
    transition:transform var(--dur-short) var(--ease-spring), box-shadow var(--dur-short), border-color var(--dur-short);}
  .card:hover{transform:translateY(-4px); box-shadow:var(--shadow-card-hover);}
  .card--link{cursor:pointer;}
  .card--link h3 a::after{content:""; position:absolute; inset:0; z-index:1; border-radius:var(--radius-card);}
  .card--link:hover{border-color:var(--color-accent-2);}
  .card--link:hover h3 a{text-decoration:underline; text-underline-offset:3px;}
  .card--link:focus-within{outline:3px solid var(--color-focus); outline-offset:2px;}
  .card-go{margin-top:auto; padding-top:6px; font-family:var(--font-label); font-size:12px; font-weight:600; color:var(--color-accent-2-deep); display:flex; align-items:center; gap:5px;}
  .card-go span{transition:transform var(--dur-micro) var(--ease-push);}
  .card--link:hover .card-go span{transform:translate(2px,-2px);}
  .card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card h3{margin:0; font-family:var(--font-display); font-size:17px; font-weight:700; line-height:1.4; letter-spacing:-.01em; color:var(--color-ink);}
  .card h3 a{color:inherit; font-weight:700;}
  .card .team{font-size:13.5px; color:var(--color-muted); margin-top:3px;}
  .card .desc{font-size:14.5px; color:var(--color-ink-2); margin:0;}
  .badge{font-family:var(--font-label); font-size:11px; font-weight:500; letter-spacing:.04em; text-transform:uppercase; padding:4px 12px; border-radius:var(--radius-pill); white-space:nowrap;}
  .badge.활성{background:var(--tint-mint); color:var(--color-mint-deep);}
  .badge.비활성{background:var(--color-paper-3); color:var(--color-muted);}
  .field-pill{display:inline-block; font-family:var(--font-label); font-size:11.5px; font-weight:500; background:var(--tint-lavender); color:var(--color-lavender-deep); border-radius:var(--radius-pill); padding:3px 12px;}
  .prog{display:flex; align-items:center; gap:12px;}
  .prog .track{flex:1; height:9px; background:var(--color-paper-3); border-radius:var(--radius-pill); overflow:hidden;}
  .prog .fill{height:100%; border-radius:var(--radius-pill); background:var(--color-mint);}
  .prog b{font-family:var(--font-display); font-size:15px; font-weight:700; min-width:44px; text-align:right; color:var(--color-ink);}
  .prog .lbl{font-family:var(--font-label); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--color-muted); white-space:nowrap;}
  .git-meta{display:flex; gap:16px; flex-wrap:wrap; font-family:var(--font-label); font-size:12.5px; color:var(--color-muted);}
  .git-meta b{color:var(--color-ink); font-weight:600;}
  .card .note{font-size:13.5px; background:var(--color-paper-2); border:1px solid var(--color-rule); border-radius:var(--radius-input); padding:11px 14px; color:var(--color-ink-2);}
  .card .note .d{font-family:var(--font-label); color:var(--color-muted); font-size:11.5px; margin-right:7px;}

  /* ===== Lower grid ===== */
  .grid2{display:grid; grid-template-columns:1.4fr 1fr; gap:20px; align-items:stretch;}
  @media(max-width:900px){.grid2{grid-template-columns:1fr;}}
  /* 2x2 grid: equal row height + vertical centering of panel content */
  .grid2 .panel{display:flex; flex-direction:column; margin-bottom:0; min-width:0;}
  .grid2 .panel > :not(h2){flex:1;}
  #fieldDonut,#statusDonut{display:flex; align-items:center;}

  /* ===== Week chart ===== */
  .weekchart{display:flex; align-items:flex-end; gap:8px; height:170px; padding-top:8px;}
  .weekchart .col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:7px; min-width:0; height:100%;}
  .weekchart .bar{width:72%; max-width:36px; background:var(--color-accent-2); border-radius:9px 9px 3px 3px;}
  .weekchart .bar.future{background:var(--color-rule);}
  .weekchart .cnt{font-family:var(--font-label); font-size:12px; font-weight:500; color:var(--color-accent-2-deep);}
  .weekchart .wk{font-family:var(--font-label); font-size:11px; color:var(--color-muted); white-space:nowrap;}

  /* ===== Donut ===== */
  .donut-wrap{display:grid; grid-template-columns:140px 1fr; gap:18px; align-items:center;}
  .donut{width:130px; height:130px; border-radius:50%; display:grid; place-items:center;}
  .donut-center{width:72px; height:72px; border-radius:50%; background:var(--color-paper); display:grid; place-items:center;
    font-family:var(--font-display); font-weight:700; font-size:22px; text-align:center; line-height:1.1; color:var(--color-ink); box-shadow:var(--shadow-card);}
  .donut-center span{display:block; font-family:var(--font-label); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--color-muted); font-weight:500;}
  .legend{display:grid; gap:9px; font-size:14px;}
  .legend .row{display:flex; justify-content:space-between; gap:8px;}
  .legend .row b{font-family:var(--font-label); font-weight:600; color:var(--color-ink);}
  .legend .dot{display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:8px;}

  /* ===== Feed ===== */
  .feed{display:grid; gap:13px;}
  .feed .item{border-bottom:1px solid var(--color-rule); padding-bottom:12px; font-size:14px;}
  .feed .item:last-child{border-bottom:0; padding-bottom:0;}
  .feed .who{font-weight:600; color:var(--color-ink);}
  .feed .when{font-family:var(--font-label); color:var(--color-muted); font-size:11.5px; margin-left:8px;}
  .feed .kind{font-family:var(--font-label); font-size:10.5px; font-weight:500; letter-spacing:.03em; text-transform:uppercase; border-radius:var(--radius-pill); padding:3px 10px; margin-right:8px; vertical-align:1px;}
  .feed .kind.커밋{background:var(--tint-mint); color:var(--color-mint-deep);}
  .feed .kind.이슈{background:var(--tint-coral); color:var(--color-accent-3-deep);}
  .feed .kind.보고{background:var(--tint-cyan); color:oklch(46% 0.18 235);}

  /* ===== Showcase ===== */
  .show-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr)); gap:14px;}
  .show-item{border:1px solid var(--color-rule); border-radius:var(--radius-card); padding:16px 18px; background:var(--color-paper); box-shadow:var(--shadow-card); font-size:14px; color:var(--color-ink-2);}
  .show-item b{display:block; font-family:var(--font-display); font-size:15px; color:var(--color-ink); margin-bottom:4px;}
  .show-item .muted{display:block; margin-bottom:7px;}

  /* ===== Guide views ===== */
  .guide-view .gv-head{display:flex; gap:16px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
  .guide-view .gv-h{flex:1; min-width:200px;}
  .guide-view .gv-head h2{margin:0; gap:0;}
  .guide-view .gv-head h2::before{display:none;}
  .guide-view .gv-tag{margin:6px 0 0; font-size:14.5px; color:var(--color-muted);}
  .guide-view .g-ico{flex:none; width:54px; height:54px; border-radius:16px; display:grid; place-items:center; font-size:26px; background:var(--accent-soft);}
  .gv-sum{background:var(--accent-soft); border:1px solid var(--color-rule); border-radius:var(--radius-card); padding:18px 22px; margin:10px 0 14px;}
  .g-sumhead{font-family:var(--font-label); font-size:12px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--accent);}
  .g-sum{list-style:none; padding:0; margin:10px 0 0; display:grid; gap:10px;}
  .g-sum li{position:relative; padding-left:26px; font-size:15.5px; color:var(--color-ink-2); line-height:1.5;}
  .g-sum li::before{content:"→"; position:absolute; left:0; top:0; color:var(--accent); font-weight:700;}

  .g-btn{flex:none; font-family:var(--font-display); font-weight:600; font-size:14.5px; border:0; border-radius:var(--radius-pill);
    padding:12px 22px; cursor:pointer; text-align:center; transition:transform 140ms var(--ease-push), box-shadow 140ms var(--ease-push);}
  .g-btn.view{--edge:color-mix(in oklab, var(--accent), black 20%); background:var(--accent); color:#fff;
    box-shadow:0 4px 0 0 var(--edge), 0 6px 12px -3px oklch(20% 0.012 250 / .3);}
  .g-btn.view:hover{transform:translateY(-2px); box-shadow:0 6px 0 0 var(--edge), 0 12px 22px -4px oklch(20% 0.012 250 / .3);}
  .g-btn.view:active{transform:translateY(3px); box-shadow:0 1px 0 0 var(--edge), 0 2px 6px -2px oklch(20% 0.012 250 / .3); transition-duration:70ms;}
  .g-btn.dl{background:transparent; color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent);}
  .g-btn.dl:hover{background:var(--accent-soft);}
  .g-btn:focus-visible{outline:3px solid var(--color-focus); outline-offset:3px;}
  .gv-dl{padding:12px 22px;}

  .m-sec{padding:18px 0; border-top:1px solid var(--color-rule);}
  .m-sec:first-child{border-top:0; padding-top:4px;}
  .m-sec h4{margin:0 0 10px; font-family:var(--font-display); font-size:17px; font-weight:700; color:var(--color-ink);}
  .guide-view .m-sec h4{color:var(--accent);}
  .m-sec p{margin:0 0 9px; font-size:15.5px; color:var(--color-ink-2); line-height:1.7;}
  .m-sec ul{margin:0; padding-left:20px; display:grid; gap:8px;}
  .m-sec li{font-size:15.5px; color:var(--color-ink-2); line-height:1.6;}
  .m-sec li b{color:var(--color-ink);}
  .doc-list{display:grid; gap:10px; margin-top:6px;}
  .doc-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:14.5px; padding:13px 16px;
    border:1px solid var(--color-rule); border-radius:var(--radius-input); background:var(--color-paper-2); transition:border-color var(--dur-micro) var(--ease-push);}
  .doc-row:hover{border-color:var(--color-rule-2);}
  .doc-row .dn{flex:1; min-width:160px; color:var(--color-ink); font-weight:500;}
  .doc-row a{font-family:var(--font-label); font-size:13.5px; font-weight:500; color:var(--accent);}
  .doc-row a + a{margin-left:2px;}
  .g-docs{font-size:13px; color:var(--color-muted); margin-top:-2px;}

  /* ===== Info-view helpers (plan / chat) ===== */
  .lead{font-size:16.5px; color:var(--color-ink-2); margin:2px 0 6px; line-height:1.65;}
  .plain{margin:0; padding:0; list-style:none; display:grid; gap:13px;}
  .plain li{position:relative; padding-left:24px; font-size:16px; color:var(--color-ink-2); line-height:1.55;}
  .plain li::before{content:""; position:absolute; left:2px; top:9px; width:9px; height:9px; border-radius:50%; background:var(--color-accent);}
  .plain li b{color:var(--color-ink);}
  .stat-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:18px;}
  @media(max-width:640px){.stat-strip{grid-template-columns:repeat(2,1fr);}}
  .stat-cell{background:var(--color-paper); border:1px solid var(--color-rule); border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:20px 22px;}
  .stat-cell b{display:block; font-family:var(--font-display); font-size:34px; font-weight:700; letter-spacing:-.02em; color:var(--color-ink); line-height:1;}
  .stat-cell span{font-family:var(--font-label); font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--color-muted); display:block; margin-top:8px;}
  .tl-list{display:grid; gap:0;}
  .tl-row{display:flex; align-items:center; gap:16px; padding:15px 0; border-bottom:1px solid var(--color-rule);}
  .tl-row:last-child{border-bottom:0;}
  .tl-date{flex:none; width:58px; font-family:var(--font-label); font-size:14px; font-weight:500; color:var(--color-accent-2-deep);}
  .tl-dot{flex:none; width:13px; height:13px; border-radius:50%; background:var(--color-mint); box-shadow:0 0 0 5px var(--tint-mint);}
  .tl-label{font-size:16px; color:var(--color-ink);}
  .step-n{flex:none; width:32px; height:32px; border-radius:12px; background:var(--color-accent); color:var(--color-ink); font-family:var(--font-display); font-size:15px; font-weight:700; display:grid; place-items:center;}

  /* ===== 추진 일정 로드맵 (좌→우 · 턴 · 우→좌 serpentine) ===== */
  .roadmap{position:relative; margin-top:18px;}
  .rm-lane{position:relative; height:150px;}
  .rm-road{position:absolute; left:0; right:0; top:38px; height:6px; background:var(--color-rule-2); border-radius:3px;}
  .rm-turn{position:absolute; top:38px; width:40px; height:156px; border:6px solid var(--color-rule-2); box-sizing:border-box;}
  .rm-turn.right{right:0; border-left:0; border-radius:0 26px 26px 0;}
  .rm-turn.left{left:0; border-right:0; border-radius:26px 0 0 26px;}
  .rm-pins{position:relative; z-index:1; display:flex; justify-content:space-around; height:100%;}
  .rm-pins.rev{flex-direction:row-reverse;}
  .rm-pin{position:relative; flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; padding-top:18px;}
  .rm-badge{flex:none; width:46px; height:46px; border-radius:50%; background:var(--color-paper); border:3px solid var(--color-rule-2);
    display:grid; place-items:center; box-shadow:0 3px 8px -2px oklch(20% 0.012 250 / .22);}
  .rm-badge span{font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--color-ink);}
  .rm-badge.hl{background:var(--color-mint); border-color:var(--color-mint-deep);}
  .rm-badge.done{background:var(--tint-mint); border-color:var(--color-mint-deep);}
  .rm-badge.done span{color:var(--color-mint-deep);}
  .rm-today{position:absolute; top:-6px; left:50%; transform:translateX(-50%); z-index:2; display:flex; flex-direction:column; align-items:center; gap:1px; pointer-events:none;}
  .rm-today b{font-family:var(--font-label); font-size:10px; font-weight:700; letter-spacing:.04em; color:var(--color-accent-3-deep);}
  .rm-today i{width:2px; height:12px; background:var(--color-accent-3); border-radius:1px;}
  .rm-info{margin-top:12px; text-align:center; padding:0 6px;}
  .rm-info b{display:block; font-size:14px; font-weight:600; color:var(--color-ink); line-height:1.3;}
  .rm-info span{font-family:var(--font-label); font-size:11.5px; font-weight:600; color:var(--color-accent-2-deep);}
  @media(max-width:720px){
    .rm-road,.rm-turn{display:none;}
    .rm-lane{height:auto;}
    .rm-pins,.rm-pins.rev{flex-direction:column; gap:14px; margin-bottom:14px;}
    .rm-pin{flex-direction:row; align-items:center; gap:12px; padding-top:0;}
    .rm-info{text-align:left;}
  }

  /* ===== Open-chat ===== */
  .join-box{margin-top:18px; padding:28px; border:1px solid var(--color-rule); border-radius:var(--radius-card); background:var(--color-paper-2); text-align:center;}
  .join-btn{--edge:var(--color-accent-deep); display:inline-block; background:var(--color-accent); color:var(--color-ink);
    font-family:var(--font-display); font-weight:700; font-size:16.5px; border-radius:var(--radius-pill); padding:15px 32px;
    box-shadow:0 4px 0 0 var(--edge), 0 6px 12px -3px oklch(76% 0.20 95 / .5); transition:transform 140ms var(--ease-push), box-shadow 140ms var(--ease-push);}
  .join-btn:hover{transform:translateY(-2px); box-shadow:0 6px 0 0 var(--edge), 0 12px 22px -4px oklch(76% 0.20 95 / .5); text-decoration:none;}
  .join-btn:active{transform:translateY(3px); box-shadow:0 1px 0 0 var(--edge); transition-duration:70ms;}
  .join-btn.disabled{background:var(--color-paper-3); color:var(--color-muted); box-shadow:none; cursor:default; border:1px solid var(--color-rule-2);}
  .join-box .muted{margin:14px 0 0; font-size:13.5px;}

  /* ===== 접근성 유틸 ===== */
  .sr-only{position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  .skip-link{position:absolute; left:12px; top:-64px; z-index:100; background:var(--color-ink); color:#fff;
    font-family:var(--font-display); font-weight:700; font-size:15px; padding:12px 20px; border-radius:0 0 12px 12px;
    transition:top .16s var(--ease-push);}
  .skip-link:focus{top:0; text-decoration:none;}
  #mainContent{outline:none;}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--color-focus); outline-offset:2px; border-radius:6px;}

  /* ===== 검색 필드 + 지우기 ===== */
  .search-field{position:relative; flex:1 1 240px; display:flex;}
  .search-field input{flex:1; padding-right:44px;}
  .search-clear{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:34px; height:34px;
    border:0; background:transparent; color:var(--color-neutral); font-size:15px; border-radius:50%; cursor:pointer; line-height:1;}
  .search-clear:hover{background:var(--color-paper-3); color:var(--color-ink);}

  /* ===== 로딩 스피너 ===== */
  .spinner{display:inline-block; width:16px; height:16px; margin-right:9px; vertical-align:-3px;
    border:2.5px solid var(--color-rule-2); border-top-color:var(--color-accent-2-deep); border-radius:50%;
    animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  footer{margin-top:32px; padding-top:22px; border-top:1px solid var(--color-rule);
    font-family:var(--font-label); font-size:13px; letter-spacing:.02em; color:var(--color-muted); text-align:center;}

  /* ===== 모바일 최적화 (태블릿 → 폰) ===== */
  /* 태블릿 폭: metrics 5개를 3+2로 */
  @media(min-width:641px) and (max-width:900px){
    .metrics{grid-template-columns:repeat(3,1fr);}
  }
  @media(max-width:820px){
    .wrap{padding:22px 16px 72px;}
    header .inner{padding:22px 16px 20px;}
    .nav-inner{padding:10px 16px;}
    .panel{padding:20px 18px;}
    .sched{padding:18px 18px;}
    /* 가로 타임라인: 라벨 겹침 방지 — 좁은 폭에서는 가로 스크롤 */
    .timeline-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; padding:26px 0 56px;}
    .timeline{min-width:600px; margin:0 16px;}
  }
  @media(max-width:640px){
    body{font-size:16px;}
    header .inner{gap:16px;}
    header h1{font-size:22px;}
    header .sub{font-size:13.5px;}
    .mark{width:46px; height:46px; font-size:17px;}
    .dday-wrap{width:100%; gap:10px;}
    .dday{min-width:0; flex:1; padding:10px 14px;}
    .dday b{font-size:22px;}
    .metrics{gap:12px;}
    .metric .value{font-size:26px;}
    /* 14주 커밋 차트: 좁은 폭에서 라벨 겹침 방지 — 가로 스크롤 */
    #weekChart{overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px;}
    .weekchart{min-width:460px;}
    .panel h2{font-size:19px;}
    .stat-cell b{font-size:28px;}
    .guide-view .gv-head{gap:12px;}
    .gv-dl{width:100%;}
  }
  @media(max-width:420px){
    .donut-wrap{grid-template-columns:1fr; justify-items:center; text-align:center;}
    .donut-wrap .legend{width:100%;}
  }

  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    .tabview{animation:none;}
    .scroll-hint{animation:none;}
    .metric,.card{transition:none;}
    .metric:hover,.card:hover{transform:none;}
    .timeline-cue .tc-arrow{animation:none;}
    .g-btn,.join-btn,.nav-btn{transition:none;}
    .g-btn.view:hover,.join-btn:hover,.g-btn.view:active,.join-btn:active{transform:none;}
  }
</style>
</head>
<body>
<a class="skip-link" href="#mainContent">본문 바로가기</a>

<header>
  <div class="inner">
    <div class="brand">
      <div class="mark">AX</div>
      <div>
        <p class="eyebrow">KISA · AI TRANSFORMATION</p>
        <h1 id="contestTitle">KISA AX 공모전 진행 현황</h1>
        <p class="sub" id="contestSub"></p>
      </div>
    </div>
    <div class="dday-wrap">
      <div class="dday"><b id="weekNow">-</b><span id="weekNowLabel">진행 주차</span></div>
      <div class="dday"><b id="dday">-</b><span>최종발표</span></div>
    </div>
  </div>
</header>

<nav class="mainnav" id="mainNav" aria-label="주요 메뉴">
  <div class="nav-inner">
    <div class="nav-group">
      <span class="nav-group-label">대회 진행</span>
      <button class="nav-btn active" data-view="dashboard" aria-current="page">전체 일정 · 추진현황</button>
      <button class="nav-btn" data-view="plan">공모전 운영계획</button>
    </div>
    <div class="nav-group">
      <span class="nav-group-label">참가자 자료</span>
      <button class="nav-btn" data-view="security">AI 도구 보안</button>
      <button class="nav-btn" data-view="ethics">인공지능 윤리</button>
      <button class="nav-btn" data-view="edu">AI 강의자료</button>
      <button class="nav-btn" data-view="refs">참고사이트</button>
      <button class="nav-btn" data-view="chat">오픈채팅방</button>
    </div>
  </div>
</nav>

<main id="mainContent" class="wrap" tabindex="-1">

  <!-- 전체 일정 · 과제별 추진현황 -->
  <section class="tabview" data-view="dashboard" id="viewDashboard">
    <div class="status-msg" id="statusMsg" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span>대시보드 데이터를 불러오는 중입니다...</div>
    <div id="app" hidden>
      <div class="dash">
        <p class="page-kicker">한눈에 보는 현황</p>
        <div class="notice" id="notice"></div>
        <section class="metrics" id="metrics"></section>

        <section class="panel sched">
          <div class="panel-head">
            <h2>전체 일정</h2>
            <span class="muted" id="updatedAt"></span>
          </div>
          <div class="timeline-wrap">
            <p class="timeline-cue" aria-hidden="true"><span class="tc-arrow">↔</span> 좌우로 밀어서 전체 일정 보기</p>
            <div class="timeline-scroll"><div class="timeline" id="timeline"></div></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>과제별 추진현황</h2>
            <span class="muted" id="resultCount" role="status" aria-live="polite"></span>
          </div>
          <div class="filters" role="search">
            <label class="sr-only" for="fieldFilter">분야별 필터</label>
            <select id="fieldFilter"></select>
            <label class="sr-only" for="statusFilter">상태별 필터</label>
            <select id="statusFilter">
              <option value="all">상태 전체</option>
              <option>활성</option><option>비활성</option>
            </select>
            <div class="search-field">
              <label class="sr-only" for="searchInput">과제명·팀·설명 검색</label>
              <input type="search" id="searchInput" placeholder="과제명·팀·설명 검색">
              <button type="button" class="search-clear" id="searchClear" aria-label="검색어 지우기" hidden>✕</button>
            </div>
          </div>
          <div class="cards" id="cards"></div>
        </section>

        <div class="grid2">
          <section class="panel">
            <h2>주차별 커밋 활동</h2>
            <div id="weekChart"></div>
          </section>
          <section class="panel">
            <h2>분야 분포</h2>
            <div id="fieldDonut"></div>
          </section>
        </div>

        <div class="grid2">
          <section class="panel">
            <h2>최근 활동</h2>
            <div class="feed" id="feed"></div>
          </section>
          <section class="panel">
            <h2>과제 상태 비율</h2>
            <div id="statusDonut"></div>
          </section>
        </div>

        <section class="panel" id="showcasePanel">
          <div class="panel-head">
            <h2>PoC 쇼케이스</h2>
            <span class="muted">시연 가능한 결과물이 나오는 대로 추가됩니다</span>
          </div>
          <div class="show-list" id="showcase"></div>
        </section>
      </div>
    </div>
  </section>

  <!-- 공모전 운영계획 -->
  <section class="tabview" data-view="plan" id="viewPlan" hidden></section>
  <!-- AI 도구 보안 이용 가이드 -->
  <section class="tabview" data-view="security" id="viewSecurity" hidden></section>
  <!-- 인공지능 윤리 가이드 -->
  <section class="tabview" data-view="ethics" id="viewEthics" hidden></section>
  <!-- AI 강의자료 모음 -->
  <section class="tabview" data-view="edu" id="viewEdu" hidden></section>
  <!-- 참고사이트 -->
  <section class="tabview" data-view="refs" id="viewRefs" hidden></section>
  <!-- 참가자 오픈채팅방 -->
  <section class="tabview" data-view="chat" id="viewChat" hidden></section>

  <footer id="footNote"></footer>
</main>

<script>
/* 데이터는 collect.mjs가 매일 1회(09:00) gitlab.aigov.go.kr에서 수집해
 * 생성하는 data.json에서 로드된다. 과제명·팀·설명·분야는 GitLab 프로젝트
 * 메타데이터가 원본이다. 이 파일은 수정할 일이 거의 없다. */
/* Hum 다중 강조 팔레트 — 도넛/차트용 (OKLCH, 크림 배경에서 구분되는 색) */
const COLORS = ["oklch(66% 0.18 235)", "oklch(68% 0.24 18)", "oklch(80% 0.16 150)", "oklch(74% 0.16 305)", "oklch(76% 0.20 95)", "oklch(28% 0.014 250)", "oklch(56% 0.20 235)"];
const STATUS_COLORS = { "활성": "oklch(66% 0.17 150)", "비활성": "oklch(62% 0.03 250)" };
const DAY = 86400000;

function esc(v) {
  return String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}
function fmtDateShort(s) {
  const d = new Date(String(s).length <= 10 ? s + "T00:00:00+09:00" : s);
  return (d.getMonth() + 1) + "/" + d.getDate();
}
function fmtDateTime(iso) {
  if (!iso) return "-";
  return new Intl.DateTimeFormat("ko-KR", {
    timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }).format(new Date(iso));
}
function relTime(iso) {
  if (!iso) return "-";
  const sec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (sec < 3600) return Math.max(1, Math.floor(sec / 60)) + "분 전";
  if (sec < 86400) return Math.floor(sec / 3600) + "시간 전";
  return Math.floor(sec / 86400) + "일 전";
}
function conic(entries, colorFor) {
  const total = entries.reduce((s, e) => s + e[1], 0) || 1;
  let cur = 0;
  return entries.map((e, i) => {
    const start = cur, end = cur + (e[1] / total) * 100;
    cur = end;
    return colorFor(e[0], i) + " " + start + "% " + end + "%";
  }).join(", ");
}
function renderDonut(sel, entries, colorFor, caption) {
  const total = entries.reduce((s, e) => s + e[1], 0) || 1;
  const legend = entries.map((e, i) =>
    '<div class="row"><span><span class="dot" style="background:' + colorFor(e[0], i) + '"></span>' +
    esc(e[0]) + "</span><b>" + e[1] + " (" + Math.round((e[1] / total) * 100) + "%)</b></div>").join("");
  const rows = entries.map((e) =>
    '<tr><th scope="row">' + esc(e[0]) + '</th><td>' + e[1] + '개</td><td>' +
    Math.round((e[1] / total) * 100) + '%</td></tr>').join("");
  const table = '<table class="sr-only"><caption>' + esc(caption || "") + ' (총 ' + total + '개 과제)</caption>' +
    '<thead><tr><th scope="col">구분</th><th scope="col">과제 수</th><th scope="col">비율</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';
  document.querySelector(sel).innerHTML =
    '<div class="donut-wrap">' +
      '<div class="donut" role="img" aria-label="' + esc(caption || "분포") + ' 도넛 차트, 총 ' + total + '개 과제" ' +
        'style="background:conic-gradient(' + conic(entries, colorFor) + ')">' +
        '<div class="donut-center" aria-hidden="true">' + total + "<span>과제</span></div></div>" +
      '<div class="legend" aria-hidden="true">' + legend + "</div>" +
      table + "</div>";
}

function renderAll(data) {
  const C = data.contest;
  const P = data.projects;
  const kickoff = new Date(C.kickoff + "T00:00:00+09:00");
  const finale = new Date(C.finale + "T00:00:00+09:00");
  const today = new Date();
  const totalDays = Math.max(1, Math.round((finale - kickoff) / DAY));
  const totalWeeks = C.totalWeeks || Math.ceil(totalDays / 7);
  const elapsedDays = Math.min(totalDays, Math.max(0, Math.round((today - kickoff) / DAY)));
  const daysToKickoff = Math.ceil((kickoff - today) / DAY);
  const notStarted = daysToKickoff > 0; // 킥오프 전 준비 기간
  const weekNow = notStarted ? 0 : Math.min(totalWeeks, Math.floor(elapsedDays / 7) + 1);
  const ddayNum = Math.ceil((finale - today) / DAY);
  const statusOf = (p) => p.active ? "활성" : "비활성";

  document.querySelector("#contestTitle").textContent = C.title;
  document.querySelector("#contestSub").textContent = C.subtitle;
  document.querySelector("#weekNow").textContent =
    notStarted ? "D-" + daysToKickoff : (weekNow + " / " + totalWeeks + "주");
  document.querySelector("#weekNowLabel").textContent = notStarted ? "킥오프까지" : "진행 주차";
  document.querySelector("#dday").textContent = ddayNum > 0 ? "D-" + ddayNum : (ddayNum === 0 ? "D-DAY" : "종료");
  document.querySelector("#updatedAt").textContent =
    "기준시각: " + fmtDateTime(data.generatedAt) + " · " + C.refreshNote + (data.sample ? " · 예시 데이터" : "");
  document.querySelector("#footNote").textContent = C.footnote;
  const noticeEl = document.querySelector("#notice");
  if (C.notice && C.notice.text) {
    noticeEl.innerHTML =
      '<span class="tag">' + esc(C.notice.label || "공지") + "</span><b>" + esc(C.notice.text) + "</b>";
  } else {
    noticeEl.hidden = true;
  }

  /* metrics */
  const activeCount = P.filter((p) => p.active).length;
  const totalCommits = P.reduce((s, p) => s + (p.gitlab.commits || 0), 0);
  const weekCommits = data.weeklyCommits[weekNow - 1] || 0;
  const openIssues = P.reduce((s, p) => s + (p.gitlab.openIssues || 0), 0);
  const closedIssues = P.reduce((s, p) => s + (p.gitlab.closedIssues || 0), 0);
  const totalStars = P.reduce((s, p) => s + (p.gitlab.stars || 0), 0);
  const card = (label, value, hint, cls) =>
    '<article class="metric ' + cls + '">' +
      '<div class="label">' + esc(label) + "</div>" +
      '<div class="value">' + esc(value) + "</div>" +
      '<div class="hint">' + esc(hint) + "</div></article>";
  document.querySelector("#metrics").innerHTML = [
    card("공모전 과제", P.length, new Set(P.map((p) => p.team)).size + "개 팀·부서", "blue"),
    card("활성 과제", activeCount, "최근 " + (C.activeDays || 14) + "일 저장소 활동", "green"),
    card("누적 커밋", totalCommits.toLocaleString("ko-KR"), "이번 주 " + weekCommits + "건", "purple"),
    card("전체 이슈", (openIssues + closedIssues).toLocaleString("ko-KR"), "진행 " + openIssues + " / 완료 " + closedIssues, "orange"),
    card("Star", totalStars.toLocaleString("ko-KR"), "직원 관심도(로그인 사용자)", ""),
  ].join("");

  /* timeline — 가로형 (전체 폭 '전체 일정' 패널) */
  const pct = (d) => Math.min(100, Math.max(0, ((new Date(d + "T00:00:00+09:00") - kickoff) / DAY / totalDays) * 100));
  const todayPct = (elapsedDays / totalDays) * 100;
  document.querySelector("#timeline").innerHTML =
    '<div class="track"><div class="fill" style="width:' + todayPct + '%"></div></div>' +
    '<div class="today" style="left:' + todayPct + '%">오늘</div>' +
    C.milestones.map((m, i) => {
      if (m.end) {
        const a = pct(m.date), b = pct(m.end);
        const done = new Date(m.end + "T00:00:00+09:00") <= today;
        return '<div class="ms-range' + (done ? " done" : "") + '" style="left:' + a + '%; width:' + Math.max(0, b - a) + '%">' +
          '<div class="rbar"></div><div class="dot"></div>' +
          '<div class="lbl">' + esc(m.label) + '</div>' +
          '<div class="date">' + esc(fmtDateShort(m.date)) + ' ~ ' + esc(fmtDateShort(m.end)) + '</div></div>';
      }
      return '<div class="ms ' + (new Date(m.date + "T00:00:00+09:00") <= today ? "done" : "") + (i % 2 ? " ms--far" : "") + '" style="left:' + pct(m.date) + '%">' +
        '<div class="dot"></div><div class="lbl">' + esc(m.label) + "</div>" +
        '<div class="date">' + esc(fmtDateShort(m.date)) + "</div></div>";
    }).join("");

  /* filters + cards */
  const els = {
    field: document.querySelector("#fieldFilter"),
    status: document.querySelector("#statusFilter"),
    search: document.querySelector("#searchInput"),
    cards: document.querySelector("#cards"),
    count: document.querySelector("#resultCount"),
  };
  const fields = [...new Set(P.map((p) => p.field))].sort((a, b) => a.localeCompare(b, "ko"));
  els.field.innerHTML = ['<option value="all">분야 전체</option>']
    .concat(fields.map((f) => "<option>" + esc(f) + "</option>")).join("");

  function renderCards() {
    const kw = els.search.value.trim().toLowerCase();
    const field = els.field.value;
    const status = els.status.value;
    const list = P.filter((p) => {
      const hay = [p.name, p.team, p.description, p.field].join(" ").toLowerCase();
      return (field === "all" || p.field === field)
        && (status === "all" || statusOf(p) === status)
        && (!kw || hay.includes(kw));
    });
    els.count.textContent = list.length + " / " + P.length + "개 과제";
    els.cards.innerHTML = list.map((p) => {
      const g = p.gitlab || {};
      const latest = (p.updates || [])[0];
      const st = statusOf(p);
      const hasLink = p.webUrl && p.webUrl !== "#";
      return '<article class="card' + (hasLink ? " card--link" : "") + '">' +
        '<div class="top"><div>' +
          '<h3><a href="' + esc(p.webUrl || "#") + '" target="_blank" rel="noreferrer"' + (hasLink ? ' aria-label="' + esc(p.name) + ' 저장소 새 창에서 열기"' : "") + '>' + esc(p.name) + "</a></h3>" +
          '<div class="team">' + esc(p.team) + "</div>" +
        '</div><span class="badge ' + st + '">' + st + "</span></div>" +
        '<div><span class="field-pill">' + esc(p.field) + "</span></div>" +
        (p.description ? '<p class="desc">' + esc(p.description) + "</p>" : "") +
        (p.progress != null
          ? '<div class="prog"><span class="lbl">진척률</span>' +
            '<div class="track"><div class="fill" style="width:' + Number(p.progress) + '%"></div></div>' +
            "<b>" + Number(p.progress) + "%</b></div>"
          : "") +
        '<div class="git-meta">' +
          "<span>커밋 <b>" + Number(g.commits || 0).toLocaleString("ko-KR") + "</b></span>" +
          "<span>이슈 <b>" + Number(g.openIssues || 0) + "</b> / 완료 <b>" + Number(g.closedIssues || 0) + "</b></span>" +
          "<span>★ <b>" + Number(g.stars || 0) + "</b></span>" +
          "<span>최근활동 <b>" + esc(relTime(g.lastActivity)) + "</b></span>" +
        "</div>" +
        (latest
          ? '<div class="note"><span class="d">' + esc(latest.date) + "</span>" + esc(latest.note) + "</div>"
          : "") +
        (hasLink ? '<div class="card-go" aria-hidden="true">GitLab에서 열기 <span>↗</span></div>' : "") +
        "</article>";
    }).join("") || '<div class="muted">조건에 맞는 과제가 없습니다.</div>';
  }
  const clearBtn = document.querySelector("#searchClear");
  const syncClear = () => { if (clearBtn) clearBtn.hidden = !els.search.value; };
  els.search.addEventListener("input", () => { syncClear(); renderCards(); });
  els.field.addEventListener("change", renderCards);
  els.status.addEventListener("change", renderCards);
  if (clearBtn) clearBtn.addEventListener("click", () => {
    els.search.value = ""; syncClear(); renderCards(); els.search.focus();
  });
  syncClear();
  renderCards();

  /* week chart (commits) */
  const wc = data.weeklyCommits;
  const max = Math.max(1, ...wc);
  const bars = wc.map((c, i) => {
    const h = Math.max(4, Math.round((c / max) * 100));
    const future = i + 1 > weekNow;
    return '<div class="col">' +
      (future ? "" : '<span class="cnt">' + c + "</span>") +
      '<div class="bar' + (future ? " future" : "") + '" style="height:' + (future ? 4 : h) + '%"></div>' +
      '<span class="wk">' + (i + 1) + "주</span></div>";
  }).join("");
  const wkRows = wc.map((c, i) => (i + 1 <= weekNow)
    ? '<tr><th scope="row">' + (i + 1) + '주차</th><td>' + c + '건</td></tr>' : "").join("");
  document.querySelector("#weekChart").innerHTML =
    '<div class="weekchart" aria-hidden="true">' + bars + "</div>" +
    '<table class="sr-only"><caption>주차별 커밋 활동</caption>' +
    '<thead><tr><th scope="col">주차</th><th scope="col">커밋 수</th></tr></thead>' +
    '<tbody>' + wkRows + "</tbody></table>";

  /* donuts */
  renderDonut("#fieldDonut",
    Object.entries(P.reduce((m, p) => { m[p.field] = (m[p.field] || 0) + 1; return m; }, {}))
      .sort((a, b) => b[1] - a[1]),
    (k, i) => COLORS[i % COLORS.length], "분야 분포");
  renderDonut("#statusDonut",
    ["활성", "비활성"]
      .map((s) => [s, P.filter((p) => statusOf(p) === s).length])
      .filter((e) => e[1] > 0),
    (k) => STATUS_COLORS[k], "과제 상태 비율");

  /* feed: 커밋 + 이슈 + 자기보고 통합 */
  const commitItems = P.flatMap((p) => (p.recentCommits || []).map((c) => ({
    kind: "커밋", team: p.name, sort: c.date || "", when: relTime(c.date), note: c.title, url: c.url,
  })));
  const issueItems = P.flatMap((p) => (p.recentIssues || []).map((i) => ({
    kind: "이슈", team: p.name, sort: i.date || "", when: relTime(i.date),
    note: (i.state === "closed" ? "[완료] " : "") + i.title, url: i.url,
  })));
  const reportItems = P.flatMap((p) => (p.updates || []).map((u) => ({
    kind: "보고", team: p.name, sort: u.date, when: u.date, note: u.note, url: null,
  })));
  const ts = (v) => { const t = Date.parse(v); return Number.isNaN(t) ? 0 : t; };
  const feed = commitItems.concat(issueItems, reportItems)
    .sort((a, b) => ts(b.sort) - ts(a.sort))
    .slice(0, 10);
  document.querySelector("#feed").innerHTML = feed.map((it) =>
    '<div class="item"><span class="kind ' + it.kind + '">' + it.kind + "</span>" +
    '<span class="who">' + esc(it.team) + "</span>" +
    '<span class="when">' + esc(it.when) + "</span><br>" +
    (it.url && it.url !== "#"
      ? '<a href="' + esc(it.url) + '" target="_blank" rel="noreferrer">' + esc(it.note) + "</a>"
      : esc(it.note)) +
    "</div>").join("") || '<div class="muted">활동 내역이 없습니다.</div>';

  /* showcase — 등록된 항목이 없으면 패널 자체를 숨김 */
  const show = data.showcase || [];
  document.querySelector("#showcasePanel").hidden = !show.length;
  document.querySelector("#showcase").innerHTML = show.map((s) =>
    '<div class="show-item"><b>' + esc(s.name) + "</b>" +
    '<span class="muted">' + esc(s.team) + "</span>" + esc(s.desc) +
    (s.url && s.url !== "#" ? '<br><a href="' + esc(s.url) + '" target="_blank" rel="noreferrer">시연 보기 →</a>' : "") +
    "</div>").join("");

  /* 메뉴별 안내 뷰 (data.json resources 구성과 연동) */
  renderPlan(C, P);
  renderRefs();
  renderChat(C);
}

/* --- 메뉴 전환 --- */
function showView(name) {
  document.querySelectorAll(".tabview").forEach((v) => { v.hidden = v.dataset.view !== name; });
  document.querySelectorAll(".nav-btn").forEach((b) => {
    const on = b.dataset.view === name;
    b.classList.toggle("active", on);
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function initNav() {
  const valid = (n) => [...document.querySelectorAll(".tabview")].some((v) => v.dataset.view === n);
  document.querySelectorAll(".nav-btn").forEach((b) =>
    b.addEventListener("click", () => showView(b.dataset.view)));
  window.addEventListener("hashchange", () => {
    const h = location.hash.slice(1);
    if (valid(h)) showView(h);
  });
  const initial = location.hash.slice(1);
  showView(valid(initial) ? initial : "dashboard");
}

function statCell(v, label) {
  return '<div class="stat-cell"><b>' + esc(v) + "</b><span>" + esc(label) + "</span></div>";
}
function roadmapHTML(ms) {
  if (!ms || !ms.length) return "";
  const COLS = 4;
  const lanes = Math.ceil(ms.length / COLS);
  const today = new Date();
  const endKey = (m) => new Date((m.end || m.date) + "T23:59:59+09:00");
  let curIdx = ms.findIndex((m) => endKey(m) >= today);
  if (curIdx < 0) curIdx = ms.length - 1;
  let html = "";
  const ROAD_INSET = 30;
  for (let k = 0; k < lanes; k++) {
    const slice = ms.slice(k * COLS, k * COLS + COLS);
    const rev = k % 2 === 1;
    const rightConnect = (k % 2 === 0 && k < lanes - 1) || (k % 2 === 1 && k > 0);
    const leftConnect = (k % 2 === 1 && k < lanes - 1) || (k % 2 === 0 && k > 0);
    const roadStyle = "left:" + (leftConnect ? ROAD_INSET : 0) + "px; right:" + (rightConnect ? ROAD_INSET : 0) + "px";
    const pins = slice.map((m, j) => {
      const i = k * COLS + j;
      const date = esc(fmtDateShort(m.date)) + (m.end ? " ~ " + esc(fmtDateShort(m.end)) : "");
      const cls = i < curIdx ? " done" : (i === curIdx ? " hl" : "");
         return '<div class="rm-pin">' +
           (i === curIdx ? '<div class="rm-today"><b>오늘</b><i></i></div>' : "") +
           '<div class="rm-badge' + cls + '"><span>' + (i + 1) + '</span></div>' +
           '<div class="rm-info"><b>' + esc(m.label) + '</b><span>' + date + '</span></div></div>';
    }).join("");
    const turn = (k < lanes - 1) ? '<div class="rm-turn ' + (rev ? "left" : "right") + '"></div>' : "";
    html += '<div class="rm-lane"><div class="rm-road" style="' + roadStyle + '"></div>' +
      '<div class="rm-pins' + (rev ? " rev" : "") + '">' + pins + '</div>' + turn + '</div>';
  }
  return '<div class="roadmap">' + html + "</div>";
}

/* --- 전체 일정 가로 스크롤 안내 토글 --- */
function updateTimelineCue() {
  const wrap = document.querySelector(".timeline-wrap");
  const sc = wrap && wrap.querySelector(".timeline-scroll");
  if (!wrap || !sc) return;
  const scrollable = sc.scrollWidth - sc.clientWidth > 4;
  wrap.classList.toggle("is-scrollable", scrollable);
  wrap.classList.toggle("at-end", scrollable && sc.scrollLeft >= sc.scrollWidth - sc.clientWidth - 4);
}
function initTimelineCue() {
  const sc = document.querySelector(".timeline-scroll");
  if (!sc) return;
  sc.addEventListener("scroll", updateTimelineCue, { passive: true });
  window.addEventListener("resize", updateTimelineCue);
}

async function boot() {
  const msg = document.querySelector("#statusMsg");
  try {
    const res = await fetch("./data.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    renderAll(data);
    msg.hidden = true;
    document.querySelector("#app").hidden = false;
    requestAnimationFrame(updateTimelineCue);
  } catch (e) {
    msg.hidden = false;
    msg.textContent = "데이터를 불러오지 못했습니다 (" + e.message + "). " +
      "data.json이 같은 경로에 있는지 확인하세요. 로컬 미리보기는 파일 직접 열기가 아닌 " +
      "간이 웹서버(예: npx serve 또는 python -m http.server)로 접속해야 합니다.";
  }
}
renderGuideViews();
initNav();
initTimelineCue();
boot();
</script>
